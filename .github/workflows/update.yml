name: Update tracker and deploy

on:
  schedule:
    - cron: "17 * * * *"     # every hour (UTC); GitHub can still start a run late or skip one
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the Armory
        if: github.event_name != 'push'
        run: |
          pip install --quiet pillow==11.3.0
          python scripts/update.py

      - name: Save new data
        if: github.event_name != 'push'
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Nothing changed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Armory check: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
